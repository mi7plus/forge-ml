# The "blessed" dependency set made available offline to notebook `:dep` cells
# and generated projects. It mirrors the Millwright and Burn features the app is
# built with, so a notebook resolves them to versions that are vendored and known
# to compile. `packaging/build-offline-bundle.*` vendors this manifest's locked
# closure into the shipped offline runtime. Standalone (own [workspace]) so it
# does not affect the app build.
[package]
name = "forge-offline-deps"
version = "0.0.0"
edition = "2021"
publish = false

# These dependencies are declared to vendor them into the offline runtime cache,
# not to be used from `lib.rs`, so cargo-machete's "unused" flag is expected.
[package.metadata.cargo-machete]
ignored = ["millwright", "burn", "automl-core"]

[workspace]

[lib]
path = "lib.rs"

[dependencies]
millwright = { version = "2.3.1", default-features = false, features = ["eda", "onnx", "smartcore-backend", "linfa-backend"] }
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std", "train", "flex", "wgpu", "metrics"] }
# The AutoML hyperparameter-search engine, so notebook `:dep automl-core` cells
# (see examples/notebooks/burn_automl.rs) resolve offline. Light and burn-free
# (default features leave its SQLite backend off), so it adds little to the cache.
automl-core = { version = "1.4.0", default-features = false }
