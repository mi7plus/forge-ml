name: Security audit

# The dependency tree is large (burn, wgpu, arrow, rusqlite, TLS via
# tungstenite), so scan it for RUSTSEC advisories automatically instead of
# relying on the in-app "Audit" button. Runs weekly, and whenever the
# dependency manifests change. Advisories we can't act on today (transitive
# pins, unmaintained-only) are acknowledged in .cargo/audit.toml, so this job
# fails only on NEW, actionable findings.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary (fast) rather than compiling cargo-audit each run. A plain
      # `cargo audit` step reads .cargo/audit.toml, unlike the check-run action.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # `licenses` is intentionally omitted here and validated locally
      # (`just audit`) so the deny.toml allow-list can be tuned against the real
      # tree without a surprise transitive license gating pushes. advisories
      # mirror .cargo/audit.toml; bans (duplicate versions) are warn-level.
      - name: cargo deny
        run: cargo deny check advisories bans sources
