name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-14
            formats: dmg
          - os: ubuntu-24.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Bundle rust-analyzer
        shell: bash
        run: ./scripts/fetch-rust-analyzer.sh
      - name: Install packager
        run: cargo install cargo-packager --locked
      - name: Build installer
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: forge-ml-${{ runner.os }}
          path: target/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - run: find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/**/*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            SHA256SUMS
