name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

# Re-tagging the same version supersedes the previous build: cancel any in-flight
# run for this ref so old runs don't linger (e.g. one stuck on a scarce runner).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-14          # Apple Silicon (arm64)
            formats: dmg
          # Intel (macos-13) is intentionally omitted: GitHub's Intel macOS
          # runners are being retired and currently queue indefinitely. The
          # manifest arch-detection and matrix.os artifact naming below already
          # support a second macOS dmg, so re-adding `- os: macos-13` here is all
          # it takes once an Intel runner (or a cross-compile) is viable again.
          - os: ubuntu-24.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Bundle rust-analyzer
        shell: bash
        run: bash scripts/fetch-rust-analyzer.sh
      - name: Stage offline runtime (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash packaging/build-offline-bundle.sh
      - name: Stage offline runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-offline-bundle.ps1
      - name: Install packager
        run: cargo install cargo-packager --locked
      - name: Build installer
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          # matrix.os (not runner.os): the two macOS runners share runner.os
          # ("macOS"), which would collide since v4 artifact names are immutable.
          name: forge-ml-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/*.exe
            target/release/*.dmg
            target/release/*.deb
            target/release/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - run: find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Create signed update-channel manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse
          tag = os.environ["RELEASE_TAG"]
          channel = "beta" if any(mark in tag.lower() for mark in ("beta", "alpha", "rc")) else "stable"
          artifacts = []
          for path in pathlib.Path("release-artifacts").rglob("*"):
              if not path.is_file(): continue
              name = path.name
              # Two macOS dmgs now ship (Apple Silicon + Intel); tell them apart
              # by the arch cargo-packager embeds in the filename (aarch64 vs x64).
              if name.endswith(".dmg"):
                  platform = "macos-aarch64" if "aarch64" in name else "macos-x86_64"
              elif name.endswith(".exe"):
                  platform = "windows-x86_64"
              elif name.endswith((".AppImage", ".deb")):
                  platform = "linux-x86_64"
              else:
                  platform = None
              if not platform or any(a["platform"] == platform for a in artifacts): continue
              artifacts.append({"platform": platform, "url": f"https://github.com/{os.environ['RELEASE_REPOSITORY']}/releases/download/{urllib.parse.quote(tag)}/{urllib.parse.quote(name)}", "sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "size": path.stat().st_size})
          manifest = {"schema": 1, "channel": channel, "version": tag.removeprefix("v"), "published_at": "${{ github.event.repository.updated_at }}", "artifacts": artifacts}
          pathlib.Path(f"update-{channel}.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-artifacts/**/*
            update-*.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            SHA256SUMS
            update-*.json
