name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the primary gate; Windows and macOS catch the platform-specific
        # code (hidden-console handling, winresource, the .icns/.ico paths, the
        # rust-analyzer .zip vs .gz split) that would otherwise only surface during
        # the ~1h release build.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Build (workspace + examples)
        run: cargo build --workspace --examples --locked
      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Gating: the tree is formatted and clippy-clean, so keep it that way.
      - name: rustfmt check
        run: cargo fmt --all --check
      # `--all-features` so feature-gated code (adbc, forge_ml's deep-learning)
      # is compiled and linted too, instead of quietly rotting.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
