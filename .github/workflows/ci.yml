name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # daily platform coverage + generated-service compile
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Direct pushes to main run the fast Linux gate only; Windows and macOS
        # (which catch the platform-specific console/icon/rust-analyzer code)
        # run on the daily schedule, PRs, and manual dispatch — and every tag
        # still builds all three in the release workflow.
        os: ${{ (github.event_name == 'push') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-14"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Build (workspace + examples)
        run: cargo build --workspace --examples --locked
      - name: Test
        run: cargo test --workspace --locked

  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Gating: the tree is formatted and clippy-clean, so keep it that way.
      - name: rustfmt check
        run: cargo fmt --all --check
      # `--all-features` so feature-gated code (adbc, forge_ml's deep-learning)
      # is compiled and linted too, instead of quietly rotting.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  generated-services:
    name: Generated services compile
    # The generated_onnx_service_compiles test is #[ignore]d in normal runs
    # because it compiles a standalone Cargo project (slow, needs the network),
    # so nothing catches drift in the generated Rust/Axum service code. Run it
    # on the daily schedule and manual dispatch to close that gap.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Compile the generated inference services
        run: cargo test --workspace --locked -- --ignored
