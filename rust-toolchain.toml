# Pin the toolchain so release builds and the bundled offline runtime
# (packaging/build-offline-bundle.*) agree on a single rustc/cargo. The offline
# runtime ships this exact toolchain plus a vendored dependency cache, so its
# prebuilt Millwright/Burn artifacts are ABI-compatible with what notebook cells
# compile against. Contributors with rustup pick this up automatically.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
