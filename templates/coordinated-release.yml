name: Rust and Python coordinated release
on:
  workflow_dispatch:
    inputs:
      publish_crate: {type: boolean, default: false}
      publish_python: {type: boolean, default: false}
permissions: {contents: write, id-token: write, attestations: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets
      - run: cargo package
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: if test -f pyproject.toml; then python -m pip install build && python -m build; fi
  crates-io:
    if: inputs.publish_crate
    needs: validate
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - run: cargo publish
        env: {CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}"}
  pypi:
    if: inputs.publish_python
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  provenance:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: "dist/**/*"}
