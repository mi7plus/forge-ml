[package]
name = "forge_ide"
version = "0.87.0"
edition = "2021"

[workspace]
members = [".", "crates/forge-protocol", "crates/forge-storage"]
resolver = "2"

[dependencies]
eframe = { version = "=0.36.0", features = ["persistence"] }
egui = "=0.36.0"
egui_plot = "=0.37.0"
egui_code_editor = "=0.3.8"
egui_phosphor_icons = { version = "=0.5.0", default-features = false }
evcxr = "0.22"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.17.2"
serde_json = "1.0"
png = "0.18.1"
sha2 = "0.10"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
forge-protocol = { path = "crates/forge-protocol" }
forge-storage = { path = "crates/forge-storage" }
arrow = { version = "56", features = ["csv", "json", "ipc"] }
parquet = { version = "56", features = ["arrow"] }
csv = "1.3"
rusqlite = { version = "0.40", features = ["bundled"] }
adbc_core = { version = "0.24", optional = true }
keyring = "4.1"
sysinfo = "0.39"
zip = { version = "4", default-features = false, features = ["deflate"] }
millwright = { version = "2.2.1", default-features = false, features = ["eda", "onnx"] }
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std", "train", "flex", "wgpu", "metrics"] }

[features]
default = []
# Compatibility alias: Millwright is always compiled into Forge ML as of 0.31.
millwright = []
adbc = ["dep:adbc_core"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
