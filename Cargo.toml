[package]
name = "forge_ide"
version = "1.4.0"
edition = "2021"

# Installer configuration for `cargo packager` (see .github/workflows/release.yml).
# Kept here rather than a standalone Packager.toml so cargo-packager runs its
# cargo-integrated path: it auto-detects the `forge_ide` binary, reads/writes
# under target/<profile>/ (matching the workflow's upload globs), and fills the
# version from [package] above. `version` is intentionally omitted so it never
# drifts from the crate version.
[package.metadata.packager]
productName = "Forge ML"
identifier = "dev.forgeml.ide"
description = "A scientific Rust IDE for interactive machine-learning development"
authors = ["Forge ML contributors"]
category = "DeveloperTool"
licenseFile = "LICENSE"
beforePackagingCommand = "cargo build --release"
icons = [
    "packaging/icons/icon.ico",
    "packaging/icons/icon.icns",
    "packaging/icons/icon-512.png",
    "packaging/icons/icon-256.png",
    "packaging/icons/icon-128.png",
    "packaging/icons/icon-64.png",
    "packaging/icons/icon-32.png",
]
# The offline Rust runtime (toolchain + vendored Millwright/Burn dependency
# cache) is staged by packaging/build-offline-bundle.{sh,ps1} before packaging;
# shipping it lets notebook `:dep` cells build offline with no user toolchain.
# `forge-runtime` is given as a directory (not a `**/*` glob): cargo-packager
# copies a directory recursively into `<resources>/forge-runtime/…`, whereas a
# glob would try to copy the `bin`/`lib`/`vendor` subdirs as files and fail. The
# resulting `forge-runtime/` layout is what src/offline.rs looks for.
resources = ["packaging/resources/rust-analyzer*", "packaging/forge-runtime"]

[package.metadata.packager.nsis]
installMode = "currentUser"

[package.metadata.packager.deb]
depends = ["libc6", "libgcc-s1"]

# Embeds the app icon into the Windows .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[workspace]
members = [
    ".",
    "crates/forge-protocol",
    "crates/forge-storage",
    "crates/forge-cli",
    "crates/forge-ml",
]
resolver = "2"

[dependencies]
eframe = { version = "=0.36.0", features = ["persistence"] }
egui = "=0.36.0"
egui_plot = "=0.37.0"
egui_code_editor = "=0.3.8"
egui_phosphor_icons = { version = "=0.5.0", default-features = false }
evcxr = "0.22"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.17.2"
serde_json = "1.0"
toml = "1"
png = "0.18.1"
sha2 = "0.10"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
forge-protocol = { path = "crates/forge-protocol" }
forge-storage = { path = "crates/forge-storage" }
forge-cli = { path = "crates/forge-cli" }
arrow = { version = "56", features = ["csv", "json", "ipc"] }
parquet = { version = "56", features = ["arrow"] }
csv = "1.3"
rusqlite = { version = "0.40", features = ["bundled"] }
adbc_core = { version = "0.24", optional = true }
keyring = "4.1"
sysinfo = "0.39"
zip = { version = "4", default-features = false, features = ["deflate"] }
millwright = { version = "2.2.1", default-features = false, features = ["eda", "onnx", "smartcore-backend", "linfa-backend"] }
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std", "train", "flex", "wgpu", "metrics"] }
egui_tiles = { version = "0.17.1", features = ["serde"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"

[features]
default = []
adbc = ["dep:adbc_core"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
