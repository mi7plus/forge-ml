productName = "Forge ML"
identifier = "dev.forgeml.ide"
version = "0.99.0"
authors = ["Forge ML contributors"]
description = "A scientific Rust IDE for interactive machine-learning development"
category = "DeveloperTool"
licenseFile = "LICENSE"
beforePackagingCommand = "cargo build --release"
# The offline Rust runtime (toolchain + vendored Millwright/Burn dependency
# cache) is staged by packaging/build-offline-bundle.{sh,ps1} before packaging;
# shipping it lets notebook `:dep` cells build offline with no user toolchain.
resources = ["packaging/resources/rust-analyzer*", "packaging/forge-runtime/**/*"]

[nsis]
installMode = "currentUser"

[deb]
depends = ["libc6", "libgcc-s1"]
