[package]
name = "forge-cli"
version = "1.8.0"
edition = "2021"
description = "The forge command-line entry point: scaffold, add, run, and diagnose Rust ML projects around Cargo."
publish = false

[lib]
name = "forge_cli"
path = "src/lib.rs"

# Deliberately dependency-free: forge is a thin wrapper that shells out to cargo,
# rustup, and forge_ide. The `forge` binary itself lives in the forge_ide package
# (src/bin/forge.rs) so cargo-packager ships it in the installer alongside the app.
