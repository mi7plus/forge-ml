[package]
name = "forge-cef-ipc"
version = "1.12.0"
edition = "2021"
description = "Shared memory layout + command protocol for the Forge CEF offscreen-render helper. Dependency-free so the IDE can depend on it without pulling in CEF."
publish = false

# Intentionally NO dependency on the `cef` crate: forge_ide links this to read
# frames and format commands, and must never trigger cef-dll-sys's ~150MB
# Chromium download during a normal build. Only the `forge-cef` helper binary
# depends on both this crate and `cef`.
[dependencies]
