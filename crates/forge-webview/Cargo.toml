[package]
name = "forge-webview"
version = "1.13.0"
edition = "2021"
description = "Forge's own WebView window — renders an HTML file (full CSS/JS) inside the app rather than an external browser."
publish = false

# A tiny helper binary the IDE launches (like forge_manager) so the heavy
# WebView deps and their separate event loop stay out of the main egui app.
[[bin]]
name = "forge_webview"
path = "src/main.rs"

[dependencies]
wry = "0"
tao = "0"
