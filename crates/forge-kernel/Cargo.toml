# A minimal evcxr runtime host. Forge points evcxr at this tiny binary instead of
# re-exec'ing the full `forge_ide` (which links eframe/wgpu/winit/burn/…) as the
# notebook runtime child. Keeping the runtime child small avoids DLL/global-state
# conflicts when it dlopens a compiled `:dep` cell.
[package]
name = "forge-kernel"
version = "0.99.0"
edition = "2021"

[[bin]]
name = "forge-kernel"
path = "src/main.rs"

[dependencies]
evcxr = "0.22"
