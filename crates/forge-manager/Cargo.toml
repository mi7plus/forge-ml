[package]
name = "forge-manager"
version = "1.14.0"
edition = "2021"
description = "Forge Manager — a standalone GUI to inspect and manage a Forge ML project's environment (Navigator-style)."
publish = false

# The binary is `forge_manager`; the thin `forge` CLI launches it via `forge
# manage`, and it installs alongside forge_ide so it finds the app as a sibling.
[[bin]]
name = "forge_manager"
path = "src/main.rs"

[dependencies]
eframe = "=0.36.0"
egui = "=0.36.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
