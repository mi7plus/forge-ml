[package]
name = "forge_ml"
version = "1.10.0"
edition = "2021"
description = "Umbrella crate re-exporting the curated Forge ML Rust data-science stack behind one prelude."
publish = false

[features]
# Classical ML is on by default; deep learning is opt-in so a `use forge_ml`
# project stays light unless it asks for tensors.
default = ["classical"]
classical = ["dep:millwright"]
deep-learning = ["dep:burn"]
# Data wrangling: dataframes via polars. Mirrors the CLI's `data`/`classical-ml`
# profiles for the part that lives in Forge's own tree (see the note below).
data = ["dep:polars"]

[dependencies]
# All pinned to the versions already resolved in the workspace, so the umbrella
# adds no new dependency trees.
ndarray = "0.17.2"
millwright = { version = "2.3.1", optional = true, default-features = false, features = [
    "smartcore-backend",
    "linfa-backend",
] }
burn = { version = "0.22.0-pre.3", optional = true, default-features = false, features = [
    "std",
    "train",
    "flex",
] }
# `csv` + `parquet` only — the same features already active in the workspace via
# millwright's `eda`, so enabling `data` pulls no new dependency tree. (The CLI's
# `data` profile adds `lazy` too, but that is for a user's own project, not
# Forge's tree.)
polars = { version = "=0.55.2", optional = true, default-features = false, features = [
    "csv",
    "parquet",
] }
